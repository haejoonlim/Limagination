[project]
name = "orch"
version = "0.1.0"
description = "Fully autonomous langgraph coding orchestrator: branch -> AI coding -> test -> retry -> PR"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
