<html lang="ko">
<head>
<meta charset="UTF-8">
<title>소울 커맨더 · 소환제단 시뮬레이터</title>
<style>
  :root{

    --txt:#d8dde8; --dim:#7a8299; --gold:#e6c15a;
    --c1:#9aa4b8; --c2:#6ec6b8; --c3:#7fa7ff; --c4:#b48cff; --c5:#ffb454; --c6:#ff5e7a; --c7:#ff2e63;

  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a2030,var(--bg));color:var(--txt);
       font-family:'Pretendard',system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh}
  header{padding:22px 16px 8px;text-align:center}
  h1{margin:0;font-size:20px;letter-spacing:1px;color:var(--gold)}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .wrap{max-width:1100px;margin:16px auto;padding:0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
         padding:10px 16px;cursor:pointer;font-size:14px;transition:.15s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:linear-gradient(160deg,#2a2410,#1c1a12);border-color:var(--gold);color:var(--gold)}
  select,input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .stat{color:var(--dim);font-size:12px}
  .bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%}
  /* 카드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
  .card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:10px 12px;
        animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .card .g{font-size:11px;font-weight:700;letter-spacing:1px}
  .card h3{margin:4px 0 2px;font-size:16px;line-height:1.3}
  .card .origin{font-size:10px;color:var(--dim)}
  .card .meta{font-size:11px;color:var(--dim);margin:2px 0 6px}
  .card .job{color:var(--txt);font-weight:600}
  .apt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .apt span{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .apt span.hot{color:#0b0d12;font-weight:700}
  .st{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 8px;margin-top:8px;font-size:10px}
  .st div{display:flex;justify-content:space-between;border-bottom:1px dashed #2a3040;padding:1px 0}
  .st b{color:var(--txt);font-weight:600}
  .cp{text-align:right;font-size:18px;font-weight:800;margin-top:6px}
  /* 등급색 */
  .g1{color:var(--c1)} .g2{color:var(--c2)} .g3{color:var(--c3)} .g4{color:var(--c4)}
  .g5{color:var(--c5)} .g6{color:var(--c6)} .g7{color:var(--c7)}
  .b1{border-left-color:var(--c1)} .b2{border-left-color:var(--c2)} .b3{border-left-color:var(--c3)}
  .b4{border-left-color:var(--c4)} .b5{border-left-color:var(--c5);box-shadow:0 0 18px #ffb45433}
  .b6{border-left-color:var(--c6);box-shadow:0 0 26px #ff5e7755}
  .b7{border-left-color:var(--c7);box-shadow:0 0 30px #ff2e7788}
  .rare-name{color:var(--rare)}
  .rare-txt{color:var(--rare)}
  .shine{animation:sh 1.6s ease infinite}
  @keyframes sh{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
  .gauge{width:100%;height:6px;background:var(--panel2);border-radius:4px;margin-top:10px}
  .gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),var(--c5));border-radius:4px;transition:width .2s}
  .log{margin-top:10px;max-height:160px;overflow:auto;font-size:11px;color:var(--dim)}
  .apt span[data-tip],.meta span[data-tip]{position:relative;cursor:help}
  .meta span[data-tip]:hover{color:var(--gold)}
  .meta span[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
    background:#0d1017;border:1px solid var(--line);color:var(--txt);font-size:11px;line-height:1.45;
    padding:7px 9px;border-radius:8px;white-space:nowrap;z-index:50;box-shadow:0 6px 18px #0009;
  }
  .apt span[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
    background:#0d1017;border:1px solid var(--line);color:var(--txt);font-size:11px;line-height:1.45;
    padding:7px 9px;border-radius:8px;white-space:nowrap;z-index:50;box-shadow:0 6px 18px #0009;

  .st div[data-tip]{cursor:help;position:relative}
  .st div[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);
    background:#0d1017;border:1px solid var(--line);color:var(--txt);font-size:11px;line-height:1.45;
    padding:7px 9px;border-radius:8px;white-space:nowrap;z-index:50;box-shadow:0 6px 18px #0009;
  }
</style>
</head>

let used = new Set();
function mod(n, rng){ // R1~R4 변형 1회 이상
  const pre=['아르','엘','발','스카'], suf=['온','란','르','드','스','베른'];
  const t=rng.int(4);
  if(t===0) return n+suf[rng.int(suf.length)];
  if(t===1) return pre[rng.int(pre.length)]+n.slice(1);
  if(t===2){ const i=1+rng.int(n.length-1); return n.slice(0,i)+suf[rng.int(suf.length)]+n.slice(i+1); }
  return n.slice(0,-1)+suf[rng.int(suf.length)];
}
function genName(lin, grade, rng){
  if(grade==='★6'){
    let base = mod(MYTH[lin][rng.int(MYTH[lin].length)], rng);
    let t1 = TITLE5[lin][rng.int(TITLE5[lin].length)];
    let t2 = TITLE6_2[lin][rng.int(TITLE6_2[lin].length)];
    let n = `${base}, ${t1}, ${t2}`;
    let k=0; while(used.has(n)&&k++<8) n = `${mod(MYTH[lin][rng.int(MYTH[lin].length)],rng)}, ${t1}, ${t2}`;
    return {name:n, origin:'L3c 신앙 오마주'};
  }
  if(grade==='★5'){
    let base = mod(MYTH[lin][rng.int(MYTH[lin].length)], rng);
    let t = TITLE5[lin][rng.int(TITLE5[lin].length)];
    let n = `${base}, ${t}`; let k=0; while(used.has(n)&&k++<8) n=`${mod(MYTH[lin][rng.int(MYTH[lin].length)],rng)}, ${t}`;
    return {name:n, origin:'L3b 전설 오마주+칭호'};
  }
  if(grade==='★4'){
    const r = rng.f();
    if(r<0.20){ let n=`${mod(MYTH[lin][rng.int(MYTH[lin].length)],rng)}`; let k=0; while(used.has(n)&&k++<8)n=mod(MYTH[lin][rng.int(MYTH[lin].length)],rng); return {name:n, origin:'L3a 신화 오마주'}; }
    if(r<0.75) return {name: mod(MYTH[lin][rng.int(MYTH[lin].length)],rng), origin:'L3a 신화 오마주(예외경로)'};
    return {name: rng.pick(RARE_PRE)+''+SYLL_A[rng.int(SYLL_A.length)]+RARE_SUF[rng.int(RARE_SUF.length)], origin:'L2 희귀 접사'};
  }
  if(grade==='★3'){
    return {name: rng.f()<0.55 ? rng.pick(RARE_PRE)+SYLL_A[rng.int(SYLL_A.length)]+SYLL_B[rng.int(SYLL_B.length)]
                               : SYLL_A[rng.int(SYLL_A.length)]+SYLL_B[rng.int(SYLL_B.length)], origin: rng.f()<0.55?'L2 희귀 접사':'L1 음절'};
  }
  return {name: SYLL_A[rng.int(SYLL_A.length)]+SYLL_B[rng.int(SYLL_B.length)], origin:'L1 음절 조합'};
}

// ───────── RNG (2026-09-14: 기본 랜덤 시드 — 새로고침마다 새 결과 · 재현은 아래 seed 재설정으로) ─────────
let seed = Math.floor(Math.random()*0xFFFFFFFF)>>>0;
function rngClass(seed){ let s=seed>>>0;
  const next=()=>{ s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0; return s/4294967296; };
  return {f:next, int:n=>Math.floor(next()*n), pick:a=>a[Math.floor(next()*a.length)], weighted:(items)=>{ let acc=0, x=next()*items.reduce((a,b)=>a+b[1],0); for(const [k,w] of items){acc+=w; if(x<acc) return k;} return items[items.length-1][0]; }};
}
let pity=0, owned={}, floorState=50, pullCount=0, usedPers=new Set();
function rollGrade(r){
  let acc=0; for(const g in RATES){acc+=RATES[g]; if(r.f()<acc) return g;} return '★1';
}
function rollPers(r, grade){
  const pool = Object.entries(PERS_WEIGHT).filter(([p])=>!usedPers.has(p));
  let pers = r.weighted(pool.length?pool:Object.entries(PERS_WEIGHT)); // 배치 중복 방지 — 풀 소진 시 원복
  if(pers==='천애' && !['★4','★5','★6'].includes(grade)){
    // 미정A 전 천애 미달 — 중립 강제 전환 폐지, 가중치 재롤 (05 §5 4차)
    const pool2 = pool.filter(([p])=>p!=='천애');
    pers = r.weighted(pool2.length?pool2:Object.entries(PERS_WEIGHT));
  }
  return pers;
}
function rollLineage(r, pickup){
  const keys = LINEAGES.filter(l=>RACES[l].some(([_,__,g])=>floorState>=g));
  const mx = Math.max(...keys.map(l=>owned[l]||0));
  const w = keys.map(l=>{ let wt=1+(mx-(owned[l]||0))*0.2; if(pickup===l) wt*=3; return wt; });
  let acc=0, x=r.f()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<keys.length;i++){acc+=w[i]; if(x<acc) return keys[i];} return keys[keys.length-1];
}
function makeHero(r, pickup){
  const keys = LINEAGES.filter(l=>RACES[l].some(([_,__,g])=>floorState>=g));
  let lin;
  do{ lin = rollLineage(r, pickup); }while(!keys.includes(lin));
  const avail = RACES[lin].filter(([_,__,g])=>floorState>=g);
  const [race,subs] = r.pick(avail);
  const subrace = r.pick(subs);
  const grade = rollGrade(r);
  const common = Object.keys(JC).filter(j=>!Object.values(RARE_JOBS).includes(j));
  if(RARE_JOBS[lin] && r.f()<0.05){ var job = RARE_JOBS[lin]; }
  else {
    const w = RACE_JOB[race]||{};
    const wt = common.map(j=>w[j]||1.0);
    var job = weightedPick(r, common, wt);
  }
  let pers = rollPers(r, grade);
  const apt={};
  const prof = JOB_APT[job]||{};
  const raceBonus = RACE_APT_BONUS[race]||{};
  const gnum = parseInt(grade[1]);
  const tierCap = gnum>=5?7:(gnum===4?6:(gnum===3?5:4)); // 등급 게이트 — 명장=★5+ · 장인=★4+ · 숙련=★3+ · 견습=전등급 (05 §6 7차)
  const rollTier = r=>{ const x=r.int(100)+1; let acc=0; for(let t=0;t<APT_W.length;t++){acc+=APT_W[t]; if(x<=acc) return t+1;} return 7; };
  COMMON_APT.forEach(k=>{ // 생활 5 + 시설 5 — 7티어 · 프로필 ±1 · 종족 보정 · 등급 게이트 clamp (05 §6 7차)
    let v = (k in prof) ? prof[k] + (r.int(3)-1) : rollTier(r);
    apt[k] = Math.min(tierCap, Math.max(1, v + (raceBonus[k]||0)));
  });
  const rareApts = [];
  if(gnum>=3){ // 희귀 — ★3+ 5% · ★4+ +3% 재롤(독립 — 최대 2개) · 티어 5~7 · 게이트 clamp
    const pool = COMMON_RARE.concat(RACE_RARE[race]?[RACE_RARE[race]]:[]);
    const tryRare = ()=>{ const c=pool.filter(x=>!rareApts.includes(x)); if(!c.length) return; const k=r.pick(c); rareApts.push(k); const rt=r.f(); apt[k]=Math.min(tierCap, rt<0.45?5:(rt<0.80?6:7)); };
    if(r.f()<0.05) tryRare();
    if(gnum>=4 && r.f()<0.03) tryRare();
  }
  const gm=GM[grade[1]];
  const [hp,atk,df,as,mag,md,cri]=JC[job];
  const st={'HP':100*hp*gm,'ATK':10*atk*gm,'MAG':10*mag*gm,
    'PEN':2*(df-0.5)*gm,'DEF':5*df*gm,'MDEF':5*md*gm,
    'EVA':3+2*as*gm*0.1,'ASPD':50*as*gm,'CDMG':150+10*cri*gm,
    'CRI':5+3*(cri-1)*gm,'MANA':100*md*gm,'SPD_CAST':30*md*gm,'STA':80*hp*gm};
  // 종족·아종 statMods + 성격 실반영 + 개체 변량 ±7% (2026-09-14 3차)
  const mods={};
  for(const m of [RACE_MODS[race]||{}, SUB_MODS[subrace]||{}]) for(const k in m) mods[k]=(mods[k]||0)+m[k];
  const mul={...PERS_STAT_MUL[pers]};
  for(const k in mods) mul[k]=(mul[k]??1)*(1+mods[k]/100);
  for(const k in mul) if(k in st) st[k]*=mul[k];
  for(const k in PERS_STAT_PPT[pers]||{}) if(k in st) st[k]+=PERS_STAT_PPT[pers][k];
  for(const k in st) st[k]*=1+VARIANCE*(r.f()*2-1);
  for(const k in st) st[k]=PCT_KEYS.has(k)?Math.round(st[k]*10)/10:Math.round(st[k]);
  const S = st.HP*0.12+st.ATK*2+st.MAG*2+st.DEF*1.5+st.MDEF*1.5+st.ASPD*3+st.SPD_CAST*2+st.CRI*3+st.CDMG*1+st.PEN*2.5+st.EVA*2.5+st.MANA*0.05+st.STA*0.03;
  const cp = Math.round(S*PM[pers]);
  const nameRes = genName(lin, grade, r); used.add(nameRes.name);
  owned[lin]=(owned[lin]||0)+1;
  return {grade,lin,race,subrace,job,pers,apt,name:nameRes.name,origin:nameRes.origin,st,cp,
          role: ROLE_TAG[job]||'—',
          isRareJob: RARE_JOBS[lin]===job, isRareApt: rareApts.length>0, rareAptName: rareApts[0]||null, rareApts};
}

// ───────── UI ─────────
const grid=document.getElementById('grid'), summary=document.getElementById('summary');
let last10=[];
function gradeColor(g){return {'★1':'g1','★2':'g2','★3':'g3','★4':'g4','★5':'g5','★6':'g6','★7':'g7'}[g];}
function card(h){
  const div=document.createElement('div');
  div.className=`card b${h.grade[1]}`;
  const rareCls = h.grade>='★5' ? 'rare-name shine' : (h.grade>='★4'?'rare-name':'');
  const shown = Object.entries(h.apt).filter(([k,v])=> v>=4); // 1~3 은닉 — 카드는 4(견습)부터 표시 (05 §6 7차)
  const aptHtml = shown.map(([k,v])=>{
    const rare = (h.rareApts||[]).includes(k);
    const tierName = APT_TIER_NAME[v]||'';
    const hot = v>=6;
    const bg = rare ? 'var(--gold)' : (v===7?'var(--gold)':(v===6?'var(--c3)':''));
    const tip = (APT_DESC[k]||k) + ' · 티어 ' + v + '/7' + (tierName?' ('+tierName+')':'') + ' — 배율 ×' + (APT_TIER[v]||1).toFixed(2);
    const icon = rare ? '★'.repeat(v-3) : (v===7?'★★':(v===6?'★':(v===5?'●':'○')));
    const em = APT_ICON[k]||'•';
    const label = k + (tierName?` <i style="font-style:normal;font-size:.72em;opacity:.9">${tierName}</i>`:'');
    return `<span ${hot?`class="hot" style="background:${bg}"`:''} data-tip="${tip}"><i style="font-style:normal;margin-right:3px;opacity:.85">${em}</i>${label}${rare?` <b style="font-weight:800">${icon}</b>`:(v===7?'<b>★★</b>':(v===6?'<b>★</b>':''))}</span>`;
  }).join('');
  div.innerHTML=`
    <div class="g g${h.grade[1]}">${h.grade} ${h.grade>='★5'?'✦':''}${h.grade==='★6'?'★':'ㅤ'}</div>
    <h3 class="${rareCls}">${h.name}</h3>
    <div class="origin">${h.origin}</div>
    <div class="meta">
      <span data-tip="${LIN_DESC[h.lin]||''}">${h.lin}계열</span> ·
      <span data-tip="${RACE_DESC[h.race]||''}">${h.race}</span> (${h.subrace}) ·
      <span data-tip="${JOB_DESC[h.job]||''}">${h.isRareJob?'<b class="rare-txt">'+h.job+'</b>':h.job}</span>
      <span data-tip="${ROLE_DESC[h.role]||''}" style="color:var(--c3);font-weight:700">[${h.role}]</span> ·
      <span data-tip="${PERS_DESC[h.pers]||''}">${h.pers}</span></div>
    <div class="apt">${aptHtml}</div>
    <div class="st">${Object.entries(h.st).map(([k,v])=>{
      const pct = ['CRI','EVA','PEN','CDMG'].includes(k) ? '%' : '';
      const key = k==='SPD_CAST'?'CAST':k;
      return `<div data-tip="${ST_DESC[k]||k}"><span style="opacity:.8">${key}</span><b style="margin-left:auto">${v.toLocaleString()}${pct}</b></div>`;
    }).join('')}</div>
    <div class="cp cp${h.grade[1]}">CP ${h.cp.toLocaleString()}</div>`;
  return div;
}
function pull(n){
  floorState = Math.max(1, Math.min(100, parseInt(document.getElementById('floor').value)||50));
  const pickup = document.getElementById('pickup').value || null;
  const r = rngClass(seed + pullCount*7919);
  const frag = document.createDocumentFragment();
  let got=[];
  usedPers.clear(); // 배치 단위 성격 중복 방지 (05 §5 3차)
  for(let i=0;i<n;i++){
    const h = makeHero(r, pickup);
    got.push(h); pullCount++;
    usedPers.add(h.pers);
    pity = ['★4','★5','★6'].includes(h.grade) ? 0 : pity+1;
    frag.appendChild(card(h));
  }
  grid.prepend(frag);
  applySort();
  if(n<=10){ last10=got.concat(last10).slice(0,10); }
  document.getElementById('pityStat').textContent = `천장 카운터 ${pity}회 (★4+ 출현 시 리셋)`;
  document.getElementById('pityBar').style.width = Math.min(100, pity/2)+'%';
  // 요약 (100연차용)
  if(n>=100){
    const c={}; got.forEach(h=>c[h.grade]=(c[h.grade]||0)+1);
    summary.style.display='block';
    summary.innerHTML = `<b>${n}연차 결과</b> · ` +
      Object.keys(RATES).map(k=>`${k}:${c[k]||0} (기대 ${(n*RATES[k]).toFixed(1)})`).join(' · ') +
      `<br>평균 CP ${(got.reduce((a,b)=>a+b.cp,0)/got.length).toFixed(0)} · 최고 CP ${Math.max(...got.map(h=>h.cp)).toLocaleString()}`;
  }
}
function applySort(){
  const mode = document.getElementById('sort').value;
  const cards = [...grid.children];
  if(mode==='cp'){
    cards.sort((a,b)=>(parseInt(b.querySelector('.cp').textContent.replace(/[^0-9]/g,''))||0)
                   - (parseInt(a.querySelector('.cp').textContent.replace(/[^0-9]/g,''))||0));
    if(cards.length>100) cards.length = 100;  // CP정렬 시 TOP 100만 유지
  }
  grid.replaceChildren(...cards);
}
document.getElementById('sort').onchange=applySort;
document.getElementById('btn1').onclick=()=>pull(1);
document.getElementById('btn10').onclick=()=>pull(10);
document.getElementById('btn100').onclick=()=>pull(100);

// ───────── 자동 새로고침 (gacha_server.py 사용 시) ─────────
// file:// 로 직접 열면 fetch가 조용히 실패해 스킵 — http.server/gacha_server 어느 쪽이든 동작.
(function(){
  if(!location.protocol.startsWith('http')) return;            // file:// 무해 스킵
  let live=null;                                                // 마지막 확인한 해시
  const menu=document.querySelector('.panel .row');
  const dot=document.createElement('span');
  dot.className='stat'; dot.textContent='· 자동리로드 대기';
  if(menu) menu.appendChild(dot);
  function tick(){
    fetch('/__gacha_hash',{cache:'no-store'})
      .then(r=>r.ok?r.json():null)
      .then(j=>{
        if(!j||!j.hash){ return; }
        if(live===null){ live=j.hash; if(dot) dot.textContent='· 자동리로드 ON'; }
        else if(j.hash!==live){
          const editing=document.activeElement && (document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT');
          if(!editing){ location.reload(); }  // 저장 감지 → 리로드
          else { live=j.hash; }               // 입력 중이면 다음 폴링에서
        }
      })
      .catch(()=>{ if(dot) dot.textContent='· 자동리로드 꺼짐 (file:// 또는 서버 없음)'; });
  }
  tick(); setInterval(tick,1000);
})();
</script>
